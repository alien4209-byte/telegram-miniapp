<!DOCTYPE html>
<html>
<head><title>WebSocket Test</title></head>
<body>
<h1>WebSocket Test</h1>
<button onclick="connect()">Connect</button>
<pre id="log"></pre>
<script>
function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
}
function connect() {
  log('🔌 Connecting...');
  const ws = new WebSocket('wss://miniapp-scafolding.leyli4209.workers.dev/ws');
  ws.onopen = () => log('✅ Connected!');
  ws.onerror = (e) => log('❌ Error: ' + JSON.stringify(e));
  ws.onmessage = (e) => log('📩 Received: ' + e.data);
}
</script>
</body>
</html>
