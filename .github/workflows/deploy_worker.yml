name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      d1_database_id:
        description: 'Database id in toml'
        required: true
        type: string
      d1_apparent_database_id:
        description: 'Database id to actually use'
        required: true
        type: string
      pages_url:
        description: 'URL of frontend deployment in pages for CORS'
        required: true
        type: string
      worker_url:
        description: 'URL of worker deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cloudflare Workers CLI
        run: |
          npm install -g wrangler

      - name: Install dependencies
        run: npm install --production

      - name: Replace database id in wrangler.toml
        run: |
          sed -i -e 's/${{ inputs.d1_database_id }}/${{ inputs.d1_apparent_database_id }}/g' wrangler.toml
          cat wrangler.toml

      - name: Build and deploy worker
        id: deploy_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --var FRONTEND_URL:${{ inputs.pages_url }}
          echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Webhook already set manually
        run: |
          echo "✅ Webhook already set manually via curl command."
          echo "   Command used:"
          echo "   curl -X POST \"https://api.telegram.org/bot<TOKEN>/setWebhook?url=${{ inputs.worker_url }}/telegram/webhook\""
          echo ""
          echo "ℹ️ Skipping /init API call to avoid 500 errors."
          echo ""
          echo "📱 Your Mini App URL: ${{ inputs.pages_url }}"
          echo "🔗 Your Worker URL: ${{ inputs.worker_url }}"

      - name: Final instructions
        run: |
          echo "=========================================="
          echo "🎮 HOKM GAME IS READY TO PLAY!"
          echo "=========================================="
          echo ""
          echo "1. Add your bot to the group: -1002500302980"
          echo "2. Make the bot an admin"
          echo "3. Click the menu button: بازی حکم"
          echo "4. Invite 3 friends to join"
          echo "5. Play and enjoy!"
          echo ""
          echo "🚀 Deployment complete!"