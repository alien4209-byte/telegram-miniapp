name: Deploy and initialise D1 Database

on:
  workflow_dispatch:
    inputs:
      d1_database_name:
        description: 'Database name to use for creation'
        required: true
        type: string
      d1_database_id:
        description: 'Database id from wrangler.toml file'
        required: false
        type: string
  workflow_call:
    inputs:
      d1_database_name:
        description: 'Database name to use for creation'
        required: true
        type: string
      d1_database_id:
        description: 'Database id from wrangler.toml file'
        required: true
        type: string
      create_database:
        description: 'Whether to create the database or not'
        required: true
        type: boolean
    outputs:
      d1_apparent_database_id:
        value: ${{ jobs.deploy.outputs.database_apparent_id }}
        description: The id of the CloudFlare database as determined by its name

jobs:
  deploy:
    name: Deploy and initialise D1 Database
    runs-on: ubuntu-latest
    outputs:
      database_apparent_id: ${{ steps.get_db_id_by_name.outputs.uuid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cloudflare Workers CLI and tools
        run: |
          npm install -g wrangler
          sudo apt-get update && sudo apt-get install -y jq

      - name: Create the D1 database (if enabled)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ inputs.create_database == 'true' }}
        run: |
          echo "📦 Creating database ${{ inputs.d1_database_name }}..."
          wrangler d1 create ${{ inputs.d1_database_name }} || echo "Database may already exist, continuing..."

      - name: Get database ID by name
        id: get_db_id_by_name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          echo "🔍 Looking up database ID for ${{ inputs.d1_database_name }}..."
          
          # Try to get the database ID
          UUID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=${{ inputs.d1_database_name }}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].uuid')
          
          if [ -z "$UUID" ] || [ "$UUID" = "null" ]; then
            echo "⚠️ Database not found. You may need to create it manually."
            echo "uuid=${{ inputs.d1_database_id }}" >> $GITHUB_OUTPUT
          else
            echo "✅ Found database ID: $UUID"
            echo "uuid=$UUID" >> $GITHUB_OUTPUT
          fi

      - name: Replace database id in wrangler.toml
        run: |
          echo "📝 Updating wrangler.toml with database ID: ${{ steps.get_db_id_by_name.outputs.uuid }}"
          sed -i "s/${{ inputs.d1_database_id }}/${{ steps.get_db_id_by_name.outputs.uuid }}/g" wrangler.toml
          echo "📄 Updated wrangler.toml:"
          cat wrangler.toml

      - name: Initialize the database (run migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Running database migrations..."
          wrangler d1 execute ${{ inputs.d1_database_name }} --file migrations/0001_init.sql --remote || echo "⚠️ Migration failed, but continuing..."